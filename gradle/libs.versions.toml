[versions]
kotlin = "2.4.21"
kotlin-dokka = "2.2.0"
kotlinx-coroutines = "1.11.0"
arrow = "2.2.3"
versions-plugin = "0.66.0"
nmcp = "1.6.2"
logback = "1.6.5"
slf4j = "2.0.20"
micrometer = "1.17.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-slf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
arrow-stack = { module = "io.arrow-kt:arrow-stack", version.ref = "arrow" }
arrow-core = { module = "io.arrow-kt:arrow-core" }
arrow-resilience = { module = "io.arrow-kt:arrow-resilience" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "kotlin-dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "kotlin-dokka" }
versions = { id = "com.github.ben-manes.versions", version.ref = "versions-plugin" }
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
