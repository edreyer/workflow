[versions]
kotlin = "2.4.0"
kotlin-dokka = "2.2.0"
kotlinx-coroutines = "1.11.0"
arrow = "2.2.3"
kotest = "5.8.0"
versions-plugin = "0.54.0"
nmcp = "1.5.0"
foojay-resolver = "0.8.0"
jsoup = "1.22.2"
logback = "1.5.32"
slf4j = "2.0.18"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
arrow-stack = { module = "io.arrow-kt:arrow-stack", version.ref = "arrow" }
arrow-core = { module = "io.arrow-kt:arrow-core" }
arrow-fx-coroutines = { module = "io.arrow-kt:arrow-fx-coroutines" }
arrow-resilience = { module = "io.arrow-kt:arrow-resilience" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "kotlin-dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "kotlin-dokka" }
versions = { id = "com.github.ben-manes.versions", version.ref = "versions-plugin" }
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
