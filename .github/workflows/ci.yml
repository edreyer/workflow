name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and check ABI (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build checkKotlinAbi

  test-runtime:
    name: Tests on JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The last version listed becomes JAVA_HOME and runs Gradle; the build compiles with 25.
          java-version: |
            ${{ matrix.jdk }}
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test -PtestJdk=${{ matrix.jdk }} -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.jdk }}_X64,JAVA_HOME_25_X64
