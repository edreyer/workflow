name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and check ABI (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build checkKotlinAbi

  test-jdk17:
    name: Tests on JDK 17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The last version listed becomes JAVA_HOME and runs Gradle; the build compiles with 25.
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test -PtestJdk=17 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64
